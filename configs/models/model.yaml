# SAC model / network architecture hyperparameters
hidden_dim: 256

# RL discount and soft-update
gamma: 0.999
tau: 0.005

# Learning rates
actor_lr: 1.0e-3
critic_lr: 1.0e-3
alpha_lr: 5.0e-4

# Replay buffer & update schedule
batch_size: 256
buffer_size: 100000
warmup_steps: 500
updates_per_step: 1

# Optimistic SAC (Zhang et al. 2026, "Optimism as Risk-Seeking in MARL").
# When enabled, replaces SAC's entropy-regularised Bellman target with the
# entropic-risk optimistic value V(s) = (1/β) log E_a[exp(β Q(s, a))].
# Disables the α entropy temperature.
use_optimism: false
optimism_beta: 1.0       # risk-seeking coefficient β > 0; larger = more optimistic
optimism_v_samples: 16   # K samples to estimate V_opt via logsumexp
