[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-pricing-capacity-limitation"
version = "0.1.0"
description = "Decentralized multi-agent reinforcement learning for energy community battery scheduling with dynamic pricing and capacity limits"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "MARL Team", email = "aswin@dtu.dk"},
]
license = {text = "MIT"}
keywords = ["MARL", "SAC", "energy-community", "reinforcement-learning", "battery-scheduling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "gymnasium>=0.26.0",
    "pettingzoo>=1.24.0",
    "matplotlib>=3.4.0",
    "torch>=2.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.10",
    "flake8>=4.0",
    "mypy>=0.950",
]

[project.scripts]
marl-train = "marl_main:main"

[project.urls]
Homepage = "https://github.com/asmuswel/dynamic-pricing-capacity-limitation"
Repository = "https://github.com/asmuswel/dynamic-pricing-capacity-limitation.git"
Issues = "https://github.com/asmuswel/dynamic-pricing-capacity-limitation/issues"

[tool.setuptools]
py-modules = ["marl_main"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=html"
